<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400">
      <stop stop-color="#0E1220"/>
      <stop offset="1" stop-color="#161B2E"/>
    </linearGradient>
    <linearGradient id="joyL" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF1A55"/>
      <stop offset="1" stop-color="#B01040"/>
    </linearGradient>
    <linearGradient id="joyR" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#0090A8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A2038"/>
      <stop offset="1" stop-color="#252B48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Console body -->
  <rect x="40" y="48" width="560" height="304" rx="28" fill="#1A1E2C"/>
  <rect x="40" y="48" width="560" height="304" rx="28" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Left Joy-Con -->
  <path d="M40 76c0-15.5 12.5-28 28-28h36v304H68c-15.5 0-28-12.5-28-28V76z" fill="url(#joyL)"/>
  <circle cx="72" cy="150" r="14" fill="#0A0C14" opacity="0.45"/>
  <circle cx="72" cy="150" r="7" fill="#2A0A14"/>
  <rect x="66" y="210" width="12" height="12" rx="2" fill="#0A0C14" opacity="0.35"/>
  <rect x="54" y="222" width="12" height="12" rx="2" fill="#0A0C14" opacity="0.35"/>
  <rect x="78" y="222" width="12" height="12" rx="2" fill="#0A0C14" opacity="0.35"/>
  <rect x="66" y="234" width="12" height="12" rx="2" fill="#0A0C14" opacity="0.35"/>

  <!-- Right Joy-Con -->
  <path d="M536 48h36c15.5 0 28 12.5 28 28v248c0 15.5-12.5 28-28 28h-36V48z" fill="url(#joyR)"/>
  <circle cx="568" cy="130" r="6" fill="#0A0C14" opacity="0.35"/>
  <circle cx="554" cy="210" r="5" fill="#0A0C14" opacity="0.3"/>
  <circle cx="582" cy="210" r="5" fill="#0A0C14" opacity="0.3"/>
  <circle cx="568" cy="196" r="5" fill="#0A0C14" opacity="0.3"/>
  <circle cx="568" cy="224" r="5" fill="#0A0C14" opacity="0.3"/>
  <circle cx="568" cy="270" r="12" fill="#0A0C14" opacity="0.4"/>

  <!-- Screen bezel -->
  <rect x="112" y="68" width="416" height="264" rx="8" fill="#05070E"/>
  <rect x="118" y="74" width="404" height="252" rx="4" fill="url(#bg)"/>

  <!-- Top bar -->
  <text x="132" y="98" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#00F0FF">NXStation</text>
  <text x="490" y="98" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" fill="#6B7388">SNES · 128 games</text>

  <!-- Featured game cards -->
  <g filter="url(#glow)">
    <rect x="140" y="118" width="110" height="150" rx="8" fill="url(#card)" stroke="#FF1A55" stroke-width="1.5"/>
    <rect x="150" y="128" width="90" height="100" rx="4" fill="#2A1530"/>
    <rect x="160" y="148" width="70" height="8" rx="2" fill="#FF1A55" opacity="0.7"/>
    <rect x="168" y="164" width="54" height="6" rx="2" fill="#00F0FF" opacity="0.4"/>
    <text x="195" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#E8ECF8">Chrono Trigger</text>
  </g>

  <rect x="266" y="128" width="100" height="130" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="274" y="136" width="84" height="88" rx="4" fill="#152038"/>
  <rect x="284" y="156" width="64" height="6" rx="2" fill="#00F0FF" opacity="0.5"/>
  <text x="316" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#9AA3B8">Super Metroid</text>

  <rect x="382" y="128" width="100" height="130" rx="8" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="390" y="136" width="84" height="88" rx="4" fill="#1A2838"/>
  <rect x="400" y="156" width="64" height="6" rx="2" fill="#FF1A55" opacity="0.45"/>
  <text x="432" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#9AA3B8">A Link to the Past</text>

  <!-- Bottom hint bar -->
  <rect x="118" y="290" width="404" height="36" fill="#0A0C14" opacity="0.55"/>
  <text x="132" y="312" font-family="system-ui,sans-serif" font-size="9" fill="#6B7388">¶ Launch   Í Favorite   Î Scrape   • Settings</text>
</svg>
