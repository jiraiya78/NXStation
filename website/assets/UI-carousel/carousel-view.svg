<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450">
      <stop stop-color="#0A0C14"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <linearGradient id="feat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF1A55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#00F0FF">SYSTEMS</text>
  <text x="400" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6B7388">Carousel View</text>

  <!-- Side cards (scaled down) -->
  <rect x="40" y="140" width="140" height="200" rx="12" fill="#141828" opacity="0.45" transform="rotate(-8 110 240)"/>
  <rect x="620" y="140" width="140" height="200" rx="12" fill="#141828" opacity="0.45" transform="rotate(8 690 240)"/>

  <!-- Center featured -->
  <rect x="230" y="100" width="340" height="260" rx="16" fill="#141828" stroke="#00F0FF" stroke-width="2"/>
  <rect x="246" y="116" width="308" height="180" rx="10" fill="url(#feat)"/>
  <rect x="290" y="160" width="220" height="16" rx="4" fill="#FF1A55" opacity="0.7"/>
  <rect x="320" y="190" width="160" height="10" rx="3" fill="#00F0FF" opacity="0.45"/>
  <rect x="340" y="214" width="120" height="10" rx="3" fill="#00F0FF" opacity="0.25"/>
  <text x="400" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="22" fill="#E8ECF8">SNES</text>
  <text x="400" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#9AA3B8">128 titles · Core ready</text>

  <!-- Dots -->
  <circle cx="370" cy="400" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="390" cy="400" r="6" fill="#00F0FF"/>
  <circle cx="410" cy="400" r="5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="430" cy="400" r="5" fill="rgba(255,255,255,0.25)"/>
